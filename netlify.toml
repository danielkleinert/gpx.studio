[build]
    # The repo is a monorepo: the `gpx` library must be built before the website.
    command = "npm install --prefix gpx && npm run build --prefix gpx && npm install --prefix website && npm run build --prefix website"
    publish = "website/build"

[build.environment]
    NODE_VERSION = "24"
    # adapter-static is served from the domain root, same as the GitHub Pages build.
    BASE_PATH = ""
    # PUBLIC_MAPTILER_KEY is a public client-side key and is inlined into the
    # bundle on purpose, so exclude it from Netlify's secrets scanner.
    SECRETS_SCAN_OMIT_KEYS = "PUBLIC_MAPTILER_KEY"

# `netlify dev` serves the SvelteKit dev server through the proxy, so the redirect
# below applies locally too. The dev server must be started from the website folder.
[dev]
    command = "npm run dev --prefix website"
    targetPort = 5173

[[headers]]
    for = "/_app/immutable/*"

    [headers.values]
        cache-control = "public, max-age=31536000, immutable"

# The GraphHopper instance rejects cross-origin requests from this domain, so the
# routing calls are proxied through the site itself.
[[redirects]]
    from = "/api/graphhopper/*"
    to = "https://graphhopper.gpx.studio/:splat"
    status = 200
    force = true
